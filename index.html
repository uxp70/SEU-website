<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEU website</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gate">
    <form id="gate-form">
      <h1>SEU website</h1>
      <p>Enter password to continue</p>
      <input id="gate-input" type="password" autocomplete="off" placeholder="Password" />
      <button type="submit">Enter</button>
      <p id="gate-error" hidden>Wrong password</p>
    </form>
  </div>

  <main id="site" hidden>
    <header class="topbar">
      <h1 id="home-title">SEU website</h1>
      <button id="logout" type="button">Log out</button>
    </header>
    <p id="home-welcome" class="welcome">Welcome to seuhq.dpdns.org</p>
    <section id="cards" class="cards"></section>
  </main>

  <script>
    // Backend origin (Render). Same login, but verified server-side.
    const API_BASE = "https://seu-backend-h7ca.onrender.com";
    // Offline fallback hash (used only if backend is unreachable).
    const FALLBACK_HASH = "3ef1d7e4be25371da4a48396925dee4f369088e794959baa69b3cc4886f758a3";

    const gate = document.getElementById("gate");
    const site = document.getElementById("site");
    const form = document.getElementById("gate-form");
    const input = document.getElementById("gate-input");
    const error = document.getElementById("gate-error");
    const logoutBtn = document.getElementById("logout");

    const FALLBACK_CARDS = [
      { title: "Projects", text: "SEU builds and experiments live here." },
      { title: "Links", text: "Add quick links here next." },
      { title: "Status", text: "All systems normal." }
    ];

    function showSite(data) {
      document.getElementById("home-title").textContent = data.title || "SEU website";
      document.getElementById("home-welcome").textContent = data.welcome || "Welcome to seuhq.dpdns.org";
      const cards = document.getElementById("cards");
      cards.innerHTML = "";
      for (const c of (data.cards || FALLBACK_CARDS)) {
        const el = document.createElement("article");
        el.className = "card";
        const h = document.createElement("h2");
        h.textContent = c.title;
        const p = document.createElement("p");
        p.textContent = c.text;
        el.append(h, p);
        cards.append(el);
      }
      gate.hidden = true;
      site.hidden = false;
    }

    // Pure-JS SHA-256: browsers disable crypto.subtle on plain http://,
    // and this site has no HTTPS cert yet, so this is the login path.
    function sha256Fallback(text) {
      var K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ];
      var bytes = new TextEncoder().encode(text);
      var l = bytes.length, bitLen = l * 8, withOne = l + 1;
      var padLen = (withOne % 64 <= 56) ? (56 - withOne % 64) : (120 - withOne % 64);
      var total = withOne + padLen + 8;
      var msg = new Uint8Array(total);
      msg.set(bytes);
      msg[l] = 0x80;
      var dv = new DataView(msg.buffer);
      dv.setUint32(total - 8, Math.floor(bitLen / 0x100000000));
      dv.setUint32(total - 4, bitLen >>> 0);
      var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
      var w = new Uint32Array(64);
      function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
      for (var off = 0; off < total; off += 64) {
        for (var i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
        for (i = 16; i < 64; i++) {
          var s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
          var s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
          w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
        }
        var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
        for (i = 0; i < 64; i++) {
          var S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
          var ch = (e & f) ^ (~e & g);
          var t1 = (h + S1 + ch + K[i] + w[i]) | 0;
          var S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
          var maj = (a & b) ^ (a & c) ^ (b & c);
          var t2 = (S0 + maj) | 0;
          h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
        }
        H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
      }
      return H.map(function(x){ return (x >>> 0).toString(16).padStart(8, "0"); }).join("");
    }

    async function sha256Hex(text) {
      try {
        if (window.isSecureContext && crypto.subtle) {
          const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
          return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
        }
      } catch { /* fall through to pure-JS below */ }
      return sha256Fallback(text);
    }

    async function backendLogin(password) {
      const r = await fetch(API_BASE + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ password })
      });
      if (!r.ok) return false;
      const home = await fetch(API_BASE + "/api/home", { credentials: "include" });
      if (!home.ok) return false;
      showSite(await home.json());
      sessionStorage.setItem("seu-auth", "backend");
      return true;
    }

    async function resumeBackend() {
      try {
        const me = await fetch(API_BASE + "/api/me", { credentials: "include" });
        if (!me.ok) return false;
        if (!(await me.json()).ok) return false;
        const home = await fetch(API_BASE + "/api/home", { credentials: "include" });
        if (!home.ok) return false;
        showSite(await home.json());
        return true;
      } catch { return false; }
    }

    async function init() {
      // Prefer backend session if a backend is reachable.
      try {
        if (await resumeBackend()) return;
      } catch { /* fall through to gate */ }
      if (sessionStorage.getItem("seu-auth") === "local") {
        showSite({ title: "SEU website", welcome: "Welcome to seuhq.dpdns.org", cards: FALLBACK_CARDS });
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.hidden = true;
      const password = input.value;
      // 1) Try backend first.
      try {
        if (await backendLogin(password)) { input.value = ""; return; }
      } catch { /* backend unreachable -> fallback below */ }
      // 2) Fallback: local hash check (works while backend is not deployed).
      if ((await sha256Hex(password)) === FALLBACK_HASH) {
        sessionStorage.setItem("seu-auth", "local");
        input.value = "";
        showSite({ title: "SEU website", welcome: "Welcome to seuhq.dpdns.org", cards: FALLBACK_CARDS });
      } else {
        error.hidden = false;
        input.value = "";
        input.focus();
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try { await fetch(API_BASE + "/api/logout", { method: "POST", credentials: "include" }); } catch {}
      sessionStorage.removeItem("seu-auth");
      site.hidden = true;
      gate.hidden = false;
      input.focus();
    });

    init();
  </script>
</body>
</html>
