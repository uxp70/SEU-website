<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEU website</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gate">
    <form id="gate-form">
      <h1>SEU website</h1>
      <p>Enter password to continue</p>
      <input id="gate-input" type="password" autocomplete="off" placeholder="Password" />
      <button type="submit">Enter</button>
      <p id="gate-error" hidden>Wrong password</p>
      <p id="gate-status" hidden></p>
    </form>
  </div>

  <div id="site" hidden>
    <aside class="sidebar">
      <div class="brand">SEU website</div>
      <nav>
        <button data-section="home" class="active" type="button">Home</button>
        <button data-section="projects" type="button">Projects</button>
        <button data-section="links" type="button">Links</button>
        <button data-section="resources" type="button">Resources</button>
      </nav>
      <button id="logout" type="button">Log out</button>
    </aside>

    <main>
      <section id="sec-home">
        <h1 id="home-title">SEU website</h1>
        <p id="home-welcome" class="welcome"></p>
        <div id="cards" class="cards"></div>
      </section>

      <section id="sec-projects" hidden>
        <h1>Projects</h1>
        <p class="welcome">Things built at SEU HQ.</p>
        <div id="project-cards" class="cards"></div>
      </section>

      <section id="sec-links" hidden>
        <h1>Links</h1>
        <p class="welcome">Quick jumps.</p>
        <ul id="link-list" class="linklist"></ul>
      </section>

      <section id="sec-resources" hidden>
        <h1>Resources</h1>
        <p class="welcome">Docs and references.</p>
        <ul id="resource-list" class="linklist"></ul>
      </section>
    </main>
  </div>

  <script>
    // All content lives on the backend and is only sent after a valid login.
    // This page is an empty shell: Inspect / View Source reveals nothing.
    const API_BASE = "https://seu-backend-h7ca.onrender.com";

    const gate = document.getElementById("gate");
    const site = document.getElementById("site");
    const form = document.getElementById("gate-form");
    const input = document.getElementById("gate-input");
    const error = document.getElementById("gate-error");
    const status = document.getElementById("gate-status");
    const logoutBtn = document.getElementById("logout");

    function setStatus(msg) {
      status.textContent = msg;
      status.hidden = !msg;
    }

    function renderCards(boxId, items) {
      const box = document.getElementById(boxId);
      box.innerHTML = "";
      for (const c of (items || [])) {
        const el = document.createElement("article");
        el.className = "card";
        const h = document.createElement("h2");
        h.textContent = c.title;
        const p = document.createElement("p");
        p.textContent = c.text;
        el.append(h, p);
        box.append(el);
      }
    }

    function renderLinks(listId, items) {
      const ul = document.getElementById(listId);
      ul.innerHTML = "";
      for (const l of (items || [])) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = l.title;
        a.href = l.url;
        a.rel = "noopener";
        li.append(a);
        ul.append(li);
      }
    }

    function showSite(data) {
      document.getElementById("home-title").textContent = data.title || "SEU website";
      document.getElementById("home-welcome").textContent = data.welcome || "";
      renderCards("cards", data.cards);
      renderCards("project-cards", data.projects);
      renderLinks("link-list", data.links);
      renderLinks("resource-list", data.resources);
      gate.hidden = true;
      site.hidden = false;
      showSection("home");
    }

    function showSection(name) {
      for (const btn of document.querySelectorAll(".sidebar nav button")) {
        btn.classList.toggle("active", btn.dataset.section === name);
      }
      for (const sec of document.querySelectorAll("main section")) {
        sec.hidden = sec.id !== "sec-" + name;
      }
    }

    document.querySelectorAll(".sidebar nav button").forEach(btn => {
      btn.addEventListener("click", () => showSection(btn.dataset.section));
    });

    async function fetchJSON(path, options) {
      const r = await fetch(API_BASE + path, options);
      if (!r.ok) {
        const err = new Error("http " + r.status);
        err.status = r.status;
        throw err;
      }
      return r.json();
    }

    // Render's free tier sleeps when idle: retry while it wakes up.
    async function withWakeUpRetries(fn, label) {
      let lastErr = null;
      for (let attempt = 1; attempt <= 4; attempt++) {
        try {
          return await fn();
        } catch (e) {
          lastErr = e;
          if (e.status === 401) throw e; // wrong password / no session: don't retry
          setStatus(label + " (attempt " + attempt + "/4)...");
          await new Promise(r => setTimeout(r, attempt * 5000));
        }
      }
      throw lastErr;
    }

    async function backendLogin(password) {
      await withWakeUpRetries(() => fetch(API_BASE + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ password })
      }).then(r => {
        if (r.status === 401) throw Object.assign(new Error("wrong password"), { status: 401 });
        if (!r.ok) throw new Error("http " + r.status);
      }), "Contacting HQ server...");
      const home = await fetchJSON("/api/home", { credentials: "include" });
      showSite(home);
      try { localStorage.setItem("seu-auth", "1"); } catch {}
    }

    async function resumeBackend() {
      const me = await fetchJSON("/api/me", { credentials: "include" });
      if (!me.ok) return false;
      const home = await fetchJSON("/api/home", { credentials: "include" });
      showSite(home);
      return true;
    }

    async function init() {
      let remembered = false;
      try { remembered = localStorage.getItem("seu-auth") === "1"; } catch {}
      if (!remembered) return;
      setStatus("Restoring session...");
      try {
        await withWakeUpRetries(resumeBackend, "Restoring session...");
        setStatus("");
      } catch {
        try { localStorage.removeItem("seu-auth"); } catch {}
        setStatus("");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.hidden = true;
      setStatus("Checking...");
      const password = input.value;
      try {
        await backendLogin(password);
        input.value = "";
        setStatus("");
      } catch (err) {
        setStatus("");
        error.hidden = false;
        error.textContent = err && err.status === 401 ? "Wrong password" : "Server unreachable - try again";
        input.value = "";
        input.focus();
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try { await fetch(API_BASE + "/api/logout", { method: "POST", credentials: "include" }); } catch {}
      try { localStorage.removeItem("seu-auth"); } catch {}
      site.hidden = true;
      gate.hidden = false;
      input.focus();
    });

    init();
  </script>
</body>
</html>
